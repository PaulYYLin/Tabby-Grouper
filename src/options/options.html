<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabby Grouper</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main>
      <header class="brand">
        <img class="brand-logo" src="/logo.png" alt="" />
        <h1 data-i18n="optionsTitle"></h1>
      </header>

      <section class="lang-section">
        <span class="lang-label" data-i18n="langSectionLabel"></span>
        <div
          id="lang-toggle"
          class="lang-toggle"
          role="radiogroup"
          aria-label="Language"
        >
          <button
            type="button"
            class="lang-opt"
            data-lang="zh"
            role="radio"
            aria-checked="false"
            data-i18n="langZh"
          ></button>
          <button
            type="button"
            class="lang-opt"
            data-lang="en"
            role="radio"
            aria-checked="false"
            data-i18n="langEn"
          ></button>
        </div>
        <p class="hint" data-i18n="langHint"></p>
      </section>

      <form id="options-form">
        <label for="provider" data-i18n="providerLabel"></label>
        <select id="provider" name="provider">
          <option value="openrouter" data-i18n="providerOpenRouter"></option>
          <option value="openai" data-i18n="providerOpenAI"></option>
          <option value="gemini" data-i18n="providerGemini"></option>
        </select>

        <label for="api-key" data-i18n="apiKeyLabel"></label>
        <input
          id="api-key"
          name="apiKey"
          type="password"
          autocomplete="off"
          spellcheck="false"
          required
        />
        <p class="hint">
          <span data-i18n="apiKeyHintPrefix"></span>
          <a id="api-key-link" target="_blank" rel="noreferrer"></a>
        </p>

        <label for="model" data-i18n="modelLabel"></label>
        <input
          id="model"
          name="model"
          type="text"
          autocomplete="off"
          spellcheck="false"
        />
        <p class="hint">
          <span id="model-hint-before"></span>
          <a id="models-link" target="_blank" rel="noreferrer"></a
          ><span data-i18n="modelHintAfter"></span><code id="model-example"></code
          ><span data-i18n="modelHintEnd"></span>
        </p>

        <label for="add-policy" data-i18n="addPolicyLabel"></label>
        <select id="add-policy" name="addDraggedTabPolicy">
          <option value="ask" data-i18n="addPolicyAsk"></option>
          <option value="always" data-i18n="addPolicyAlways"></option>
          <option value="never" data-i18n="addPolicyNever"></option>
        </select>
        <p class="hint" data-i18n="addPolicyHint"></p>

        <label for="remove-policy" data-i18n="removePolicyLabel"></label>
        <select id="remove-policy" name="removeDraggedTabPolicy">
          <option value="ask" data-i18n="removePolicyAsk"></option>
          <option value="always" data-i18n="removePolicyAlways"></option>
          <option value="never" data-i18n="removePolicyNever"></option>
        </select>
        <p class="hint" data-i18n="removePolicyHint"></p>

        <button type="submit" data-i18n="saveBtn"></button>
        <p id="save-status" class="status"></p>
      </form>
    </main>
    <script type="module" src="./options.ts"></script>
  </body>
</html>
