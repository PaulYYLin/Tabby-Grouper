<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabby Grouper</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main>
      <header class="brand">
        <img class="brand-logo" src="/logo.png" alt="" />
        <h1 data-i18n="optionsTitle"></h1>
      </header>

      <section class="lang-section">
        <span class="lang-label" data-i18n="langSectionLabel"></span>
        <div
          id="lang-toggle"
          class="lang-toggle"
          role="radiogroup"
          aria-label="Language"
        >
          <button
            type="button"
            class="lang-opt"
            data-lang="zh"
            role="radio"
            aria-checked="false"
            data-i18n="langZh"
          ></button>
          <button
            type="button"
            class="lang-opt"
            data-lang="en"
            role="radio"
            aria-checked="false"
            data-i18n="langEn"
          ></button>
        </div>
        <p class="hint" data-i18n="langHint"></p>
      </section>

      <form id="options-form">
        <label for="provider" data-i18n="providerLabel"></label>
        <select id="provider" name="provider">
          <option value="openrouter" data-i18n="providerOpenRouter"></option>
          <option value="openai" data-i18n="providerOpenAI"></option>
          <option value="gemini" data-i18n="providerGemini"></option>
        </select>

        <label for="api-key" data-i18n="apiKeyLabel"></label>
        <div class="api-key-row">
          <input
            id="api-key"
            name="apiKey"
            type="password"
            autocomplete="off"
            spellcheck="false"
            required
          />
          <button
            type="button"
            id="api-key-test"
            class="api-key-test"
            data-i18n="apiKeyTestBtn"
          ></button>
        </div>
        <p
          id="api-key-validation"
          class="hint api-key-validation"
          hidden
        ></p>
        <p class="hint">
          <span data-i18n="apiKeyHintPrefix"></span>
          <a id="api-key-link" target="_blank" rel="noreferrer"></a>
        </p>

        <label for="model" data-i18n="modelLabel"></label>
        <input
          id="model"
          name="model"
          type="text"
          autocomplete="off"
          spellcheck="false"
        />
        <p class="hint">
          <span id="model-hint-before"></span>
          <a id="models-link" target="_blank" rel="noreferrer"></a
          ><span data-i18n="modelHintAfter"></span><code id="model-example"></code
          ><span data-i18n="modelHintEnd"></span>
        </p>
        <p
          id="model-format-hint"
          class="hint"
          data-i18n="modelFormatHintNoVendor"
          hidden
        ></p>

        <label for="add-policy" data-i18n="addPolicyLabel"></label>
        <select id="add-policy" name="addDraggedTabPolicy">
          <option value="ask" data-i18n="addPolicyAsk"></option>
          <option value="always" data-i18n="addPolicyAlways"></option>
          <option value="never" data-i18n="addPolicyNever"></option>
        </select>
        <p class="hint" data-i18n="addPolicyHint"></p>

        <label for="remove-policy" data-i18n="removePolicyLabel"></label>
        <select id="remove-policy" name="removeDraggedTabPolicy">
          <option value="ask" data-i18n="removePolicyAsk"></option>
          <option value="always" data-i18n="removePolicyAlways"></option>
          <option value="never" data-i18n="removePolicyNever"></option>
        </select>
        <p class="hint" data-i18n="removePolicyHint"></p>

        <div class="toggle-row">
          <label class="toggle-label" for="user-prefs-enabled">
            <input
              id="user-prefs-enabled"
              name="userPrefsEnabled"
              type="checkbox"
            />
            <span data-i18n="userPrefsLabel"></span>
          </label>
          <span class="info-wrap">
            <button
              id="user-prefs-info-btn"
              type="button"
              class="info-icon"
              aria-controls="user-prefs-info-tip"
              aria-expanded="false"
              data-i18n-aria-label="userPrefsTooltipIcon"
            >
              ⓘ
            </button>
            <div
              id="user-prefs-info-tip"
              class="info-tooltip"
              role="tooltip"
              data-i18n="userPrefsTooltip"
              hidden
            ></div>
          </span>
        </div>
        <p class="hint" data-i18n="userPrefsHint"></p>

        <button type="submit" data-i18n="saveBtn"></button>
        <p id="save-status" class="status"></p>
      </form>

      <section id="memory-section" class="memory-section" hidden>
        <header class="memory-header">
          <h2 data-i18n="memoryTitle"></h2>
          <p class="hint" data-i18n="memoryHint"></p>
        </header>

        <div class="memory-distilled">
          <label
            for="memory-distilled-text"
            data-i18n="memoryDistilledLabel"
          ></label>
          <textarea
            id="memory-distilled-text"
            maxlength="600"
            rows="6"
            data-i18n-placeholder="memoryDistilledPlaceholder"
          ></textarea>
          <div class="memory-distilled-meta">
            <span id="memory-distilled-updated" class="hint"></span>
            <span id="memory-distilled-charcount" class="hint"></span>
          </div>
          <p
            id="memory-distilled-lang-mismatch"
            class="hint memory-warn"
            hidden
          ></p>
          <div class="memory-actions-row">
            <button
              type="button"
              id="memory-distilled-save"
              data-i18n="memorySaveBtn"
            ></button>
          </div>
        </div>

        <div class="memory-autolearn">
          <div
            id="memory-paused-banner"
            class="memory-banner memory-banner--warn"
            data-i18n="memoryPausedBanner"
            hidden
          ></div>
          <p
            id="memory-autolearn-idle"
            class="hint"
            data-i18n="memoryAutoLearnIdle"
          ></p>
          <button
            type="button"
            id="memory-run-autolearn"
            class="memory-secondary-btn"
            data-i18n="memoryRunAutoLearn"
          ></button>
        </div>

        <details class="memory-samples">
          <summary>
            <span data-i18n="memorySamplesTitle"></span>
            <span id="memory-samples-count" class="memory-samples-count"></span>
          </summary>
          <div class="memory-bucket">
            <h3 data-i18n="memoryBucketUserNames"></h3>
            <ul class="memory-bucket-list" id="memory-list-userNames"></ul>
            <button
              type="button"
              id="memory-clear-bucket-userNames"
              class="memory-link-btn"
              data-i18n="memoryClearBucket"
            ></button>
          </div>
          <div class="memory-bucket">
            <h3 data-i18n="memoryBucketAiNames"></h3>
            <ul class="memory-bucket-list" id="memory-list-aiNames"></ul>
            <button
              type="button"
              id="memory-clear-bucket-aiNames"
              class="memory-link-btn"
              data-i18n="memoryClearBucket"
            ></button>
          </div>
          <div class="memory-bucket">
            <h3 data-i18n="memoryBucketInstructions"></h3>
            <ul class="memory-bucket-list" id="memory-list-instructions"></ul>
            <button
              type="button"
              id="memory-clear-bucket-instructions"
              class="memory-link-btn"
              data-i18n="memoryClearBucket"
            ></button>
          </div>
        </details>

        <div class="memory-actions-row memory-actions-row--end">
          <button
            type="button"
            id="memory-clear-all"
            class="memory-danger-btn"
            data-i18n="memoryClearAll"
          ></button>
        </div>
        <p id="memory-status" class="status"></p>
      </section>
    </main>
    <script type="module" src="./options.ts"></script>
  </body>
</html>
