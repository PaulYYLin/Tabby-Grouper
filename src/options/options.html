<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabby Grouper 設定</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main>
      <h1>Tabby Grouper 設定</h1>
      <form id="options-form">
        <label for="api-key">OpenRouter API Key</label>
        <input
          id="api-key"
          name="apiKey"
          type="password"
          autocomplete="off"
          spellcheck="false"
          placeholder="sk-or-..."
          required
        />
        <p class="hint">
          取得 API Key：
          <a href="https://openrouter.ai/keys" target="_blank" rel="noreferrer"
            >openrouter.ai/keys</a
          >
        </p>

        <label for="model">模型（選填）</label>
        <input
          id="model"
          name="model"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="google/gemini-2.5-flash-lite"
        />
        <p class="hint">
          留空使用預設模型（google/gemini-2.5-flash-lite）。可用模型列表：
          <a href="https://openrouter.ai/models" target="_blank" rel="noreferrer"
            >openrouter.ai/models</a
          >（例：<code>openai/gpt-4o-mini</code>）
        </p>

        <label for="add-policy">手動拖入分頁時</label>
        <select id="add-policy" name="addDraggedTabPolicy">
          <option value="ask">每次詢問</option>
          <option value="always">自動加入任務</option>
          <option value="never">不加入任務</option>
        </select>
        <p class="hint">
          當你把分頁手動拖進已記錄的群組時，要不要把它寫進該任務的分頁清單。預設「每次詢問」會跳系統通知。
        </p>

        <label for="remove-policy">手動拖出分頁時</label>
        <select id="remove-policy" name="removeDraggedTabPolicy">
          <option value="ask">每次詢問</option>
          <option value="always">自動從任務移除</option>
          <option value="never">保留在任務</option>
        </select>
        <p class="hint">
          當你把已記錄的分頁拖出群組時，要不要從該任務的分頁清單移除。
        </p>

        <button type="submit">儲存</button>
        <p id="save-status" class="status"></p>
      </form>
    </main>
    <script type="module" src="./options.ts"></script>
  </body>
</html>
