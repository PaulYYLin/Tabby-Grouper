<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabby Grouper</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main>
      <h1>Tabby Grouper</h1>
      <p class="subtitle">用 AI 把相關分頁整理到同一個群組</p>
      <textarea
        id="instruction"
        class="instruction"
        rows="3"
        maxlength="512"
        placeholder="預設：根據分頁標題與網域，把相關分頁依主題分到同一組。"
      ></textarea>
      <button id="group-btn" type="button">分組目前視窗的分頁</button>
      <p id="status" class="status"></p>
      <div class="footer">
        <a id="options-link" href="#" class="options-link">開啟設定</a>
        <span id="version" class="version"></span>
      </div>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
