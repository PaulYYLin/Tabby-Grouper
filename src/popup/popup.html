<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabby Grouper</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main>
      <h1 data-i18n="appName"></h1>
      <p class="subtitle" data-i18n="subtitle"></p>

      <section id="pending-additions" class="pending" hidden>
        <header class="pending-head">
          <h3 class="pending-title" data-i18n="pendingTitle"></h3>
          <span id="pending-count" class="pending-count"></span>
        </header>
        <ul id="pending-list" class="pending-list"></ul>
        <label class="pending-remember">
          <input id="pending-dont-ask" type="checkbox" />
          <span data-i18n="pendingDontAsk"></span>
        </label>
      </section>

      <div class="tabs" role="tablist">
        <button class="tab is-active" data-view="group" type="button" role="tab">
          <span class="tab-icon" aria-hidden="true">⚡</span>
          <span class="tab-label" data-i18n="tabGroup"></span>
        </button>
        <button class="tab" data-view="tasks" type="button" role="tab">
          <span class="tab-icon" aria-hidden="true">📋</span>
          <span class="tab-label" data-i18n="tabTasks"></span>
        </button>
      </div>

      <section id="view-group" class="view view--action">
        <header class="view-header view-header--action">
          <h2 class="view-title" data-i18n="viewGroupTitle"></h2>
          <p class="view-desc" data-i18n="viewGroupDesc"></p>
        </header>
        <textarea
          id="instruction"
          class="instruction"
          rows="3"
          maxlength="512"
          data-i18n-placeholder="instructionPlaceholder"
        ></textarea>
        <button id="group-btn" class="cta" type="button" data-i18n="ctaGroup"></button>
        <p id="status" class="status"></p>
      </section>

      <section id="view-tasks" class="view view--library" hidden>
        <header class="view-header view-header--library">
          <div class="view-header-row">
            <h2 class="view-title" data-i18n="viewTasksTitle"></h2>
            <span id="tasks-count" class="view-count" hidden></span>
          </div>
          <p class="view-desc" data-i18n="viewTasksDesc"></p>
        </header>
        <input
          id="task-search"
          class="task-search"
          type="search"
          data-i18n-placeholder="taskSearchPlaceholder"
          hidden
        />
        <ul id="task-list" class="task-list"></ul>
        <p id="tasks-no-match" class="muted" data-i18n="tasksNoMatch" hidden></p>
        <p id="tasks-empty" class="empty-state" hidden>
          <span class="empty-state-title" data-i18n="tasksEmptyTitle"></span>
          <span class="empty-state-hint" data-i18n="tasksEmptyHint"></span>
        </p>
        <p id="tasks-status" class="status"></p>
      </section>

      <div class="footer">
        <a id="options-link" href="#" class="options-link" data-i18n="optionsLink"></a>
        <span id="version" class="version"></span>
      </div>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
